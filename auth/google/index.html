<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow">
  <title>Sign in to urAnime</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0b0d12; color: #f5f6fa; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px 16px; background: #0b0d12; }
    main { width: min(100%, 420px); padding: 30px 24px 26px; border: 1px solid #252c3a; border-radius: 22px; background: #151923; box-shadow: 0 20px 60px rgba(0,0,0,.24); text-align: center; }
    .brand { margin: 0; font-size: 34px; line-height: 1.1; font-weight: 850; letter-spacing: -.9px; }
    .tagline { margin: 9px 0 30px; color: #9ba4b5; font-size: 14px; }
    h1 { margin: 0 0 9px; font-size: 21px; line-height: 1.3; }
    .description { margin: 0 auto 25px; max-width: 300px; color: #a6afc0; font-size: 14px; line-height: 1.55; }
    #google-button { min-height: 44px; display: flex; justify-content: center; align-items: center; }
    #status { min-height: 20px; margin: 18px 0 0; color: #a6afc0; font-size: 12px; line-height: 1.5; }
    #status.error { color: #ffb8c0; }
    .footnote { margin: 24px 0 0; color: #737d90; font-size: 11px; line-height: 1.5; }
    .hidden { display: none !important; }
  </style>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <main>
    <p class="brand">urAnime</p>
    <p class="tagline">Discover. Journal. Track.</p>
    <h1>Continue to urAnime</h1>
    <p class="description">Sign in with your Google account to continue securely to urAnime.</p>
    <div id="google-button" aria-label="Sign in with Google"></div>
    <p id="status" role="status" aria-live="polite">Preparing secure Google sign-in…</p>
    <p class="footnote">This page is only used to complete sign-in for the urAnime Android app. You can close it if you did not start this request.</p>
  </main>
  <script>
    (() => {
      'use strict';
      const params = new URLSearchParams(window.location.search);
      const APP_ORIGIN = 'https://uranime.com';
      const clientId = params.get('client_id') || '';
      const state = params.get('state') || '';
      const nonce = params.get('nonce') || '';
      const status = document.getElementById('status');
      const button = document.getElementById('google-button');
      let completed = false;

      const showError = (message) => {
        status.textContent = message;
        status.classList.add('error');
      };

      if (!clientId.endsWith('.apps.googleusercontent.com') || !/^[a-f0-9]{64}$/i.test(state) || !/^[a-f0-9]{64}$/i.test(nonce)) {
        showError('This sign-in link is invalid or has expired. Return to urAnime and try again.');
        throw new Error('Invalid urAnime browser sign-in parameters.');
      }

      window.handleUrAnimeGoogleCredential = (response) => {
        if (completed) return;
        const credential = response && response.credential;
        if (typeof credential !== 'string' || credential.length < 100 || credential.length > 20000 || credential.split('.').length !== 3) {
          showError('Google did not return a valid sign-in credential. Return to urAnime and try again.');
          return;
        }

        completed = true;
        status.textContent = 'Google verified your account. Returning to urAnime…';
        const returnUrl = new URL('/auth/google/return/', APP_ORIGIN);
        returnUrl.hash = new URLSearchParams({ credential, state }).toString();
        // The fragment is not sent to GitHub Pages. Android receives it through
        // the verified App Link; the raw Supabase nonce never leaves the app.
        window.location.replace(returnUrl.toString());
      };

      const initialize = () => {
        if (!window.google || !window.google.accounts || !window.google.accounts.id) {
          showError('Google sign-in could not load. Check your connection and try again.');
          return;
        }

        window.google.accounts.id.initialize({
          client_id: clientId,
          callback: window.handleUrAnimeGoogleCredential,
          nonce,
          auto_select: false,
          context: 'signin',
          ux_mode: 'popup',
          use_fedcm_for_button: true
        });

        const buttonWidth = Math.max(180, Math.min(280, Math.floor(button.clientWidth || 280)));
        window.google.accounts.id.renderButton(button, {
          type: 'standard',
          theme: 'filled_black',
          size: 'large',
          text: 'continue_with',
          shape: 'rectangular',
          logo_alignment: 'left',
          width: buttonWidth
        });
        status.textContent = 'Choose your Google account to continue.';
      };

      const gsiScript = document.querySelector('script[src="https://accounts.google.com/gsi/client"]');
      if (window.google && window.google.accounts && window.google.accounts.id) {
        initialize();
      } else if (gsiScript) {
        gsiScript.addEventListener('load', initialize, { once: true });
        gsiScript.addEventListener('error', () => showError('Google sign-in could not load. Check your connection and try again.'), { once: true });
      }
    })();
  </script>
</body>
</html>
